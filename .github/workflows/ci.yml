# ImagoKit CI: the test suite (`swift test -c release`) on every pull request; after merge the consumer check, the README
# consumer and an iOS Simulator build; on a tag, the CHANGELOG version check; on every push, the private-reference scan.
#
# Package.swift declares macOS 15 and iOS 18 with tools 6.2, so the runner needs a Swift 6.2 or newer toolchain; the
# macos-26 image with Xcode 26.6, pinned below, carries both.
#
# THE PYTHON ORACLES ARE NOT RUN HERE. The tests read committed fixtures (Tests/*/Fixtures/, generated by tools/slice-*/pins.py
# against NumPy 2.5.4, SciPy 1.18.1 and scikit-image 0.26.0, tools/oracle/references-lock.txt) and compare the kit with them;
# regenerating a fixture needs the pinned Python environment on a maintainer's machine. CI therefore proves "the kit
# equals the committed pins", not "the pins equal the oracle".
#
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); `swift test -c release` is the supported way to run the tests.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned like the apps: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Test (release)
        run: swift test -c release

  post-merge:
    name: Consumer checks and iOS build (after merge)
    # Not on pull requests: the free plan's macOS runners are scarce, so the extra builds run on main, tags and by hand.
    if: github.event_name != 'pull_request'
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Consumer check (a separate package, the public API only)
        run: tools/consumer-check/run.sh
      - name: README consumer (the README's program compiled and run, drift-checked line by line)
        run: tools/readme-consumer/run.sh
      - name: Build the libraries for iOS (Simulator, not run)
        run: xcodebuild -scheme ImagoKit-Package -destination 'generic/platform=iOS Simulator' -quiet build

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
