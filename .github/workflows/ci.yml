# ImagoKit CI: the shell-guard test, the test suite (tools/test.sh = `swift test -c release`), the consumer check and the
# README consumer.
#
# Package.swift declares macOS 15 and iOS 18 with tools 6.2, so the
# runner needs a Swift 6.2 or newer toolchain. Pinned as SpectroKit 0.5.0 pins it: the `macos-26` image with the newest Xcode
# on it, its version printed by the job; the selection may be replaced with an exact Xcode path once the first run has named it.
#
# THE PYTHON ORACLES ARE NOT RUN HERE. The tests read committed fixtures (Tests/*/Fixtures/, generated by tools/slice-*/pins.py
# against NumPy 2.5.4, SciPy 1.18.1 and scikit-image 0.26.0, tools/oracle/references-lock.txt) and compare the kit with them;
# regenerating a fixture needs the gitignored References/oracle-venv on a maintainer's machine. CI therefore proves "the kit
# equals the committed pins", not "the pins equal the oracle".
#
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); tools/test.sh is the supported way to run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Hook proof (no sleep or poll loops, no kill by name)
        run: tools/hooks/test-no-sleep-poll.sh
      - name: Gate (tools/test.sh, release)
        run: tools/test.sh
      - name: Consumer check (a separate package, the public API only)
        run: tools/consumer-check/run.sh
      - name: README consumer (the README's program compiled and run, drift-checked line by line)
        run: tools/readme-consumer/run.sh
